<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-__NONCE__'; style-src 'nonce-__NONCE__'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>__TITLE__</title>
<style nonce="__NONCE__">
:root{color-scheme:light;--page:#edf2f7;--surface:#fff;--ink:#172c43;--muted:#40566e;--accent:#1749c8;--line:#c8d3df;--focus:#1749c8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);line-height:1.6}main{max-width:1180px;margin:auto;padding:48px 32px 64px}h1{font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.15;letter-spacing:-.025em;margin:0 0 16px;text-wrap:balance}h2{font-size:1.35rem;margin:0 0 10px}h3{font-size:1.05rem;margin:24px 0 8px}p{margin:8px 0;max-width:74ch}.muted,small{color:var(--muted)}header{padding-bottom:30px;border-bottom:1px solid var(--line)}.mode{display:inline-block;padding:4px 10px;background:#dce7ff;color:#14388e;border-radius:5px;font-size:.875rem}.section{margin-top:38px}.table-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}caption{text-align:left;padding:12px 16px;color:var(--muted);font-size:.875rem}th{text-align:left;background:#e4ecf4;font-weight:650}th,td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}tbody tr:last-child td{border-bottom:0}td.number{text-align:right}tbody tr:hover{background:#f3f6fb}a{color:var(--accent);text-underline-offset:.2em;overflow-wrap:anywhere}a:hover{text-decoration-thickness:2px}button,input,select{font:inherit}button,select,input{border:1px solid #8c9db1;border-radius:5px;padding:9px 11px;color:var(--ink);background:var(--surface)}button{cursor:pointer;font-weight:600}button:hover{background:#e8effc;border-color:var(--accent)}button:active{background:#dce7ff}button:disabled{cursor:default;opacity:.55}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#103aab;color:white}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;align-items:end;gap:12px;margin:20px 0 12px}label{display:grid;gap:5px;font-size:.875rem;font-weight:600}input{min-width:0;width:100%}input::placeholder{color:#52677f}select{max-width:100%}.results{margin-bottom:12px;min-height:1.5em}.empty{padding:28px 16px;text-align:center}.warning{background:#fff3ce;padding:16px 20px;border:1px solid #c6a854;border-radius:6px;margin-top:22px}.warning p{margin:4px 0}.evidence{padding:14px 18px;background:#f3f6fb}.evidence dl{display:grid;grid-template-columns:minmax(130px,1fr) 3fr;gap:6px 14px;margin:12px 0}.evidence dt{font-weight:600}.evidence dd{margin:0;overflow-wrap:anywhere}.identities{max-width:70ch;overflow-wrap:anywhere}.nowrap{white-space:nowrap}details>summary{cursor:pointer;font-weight:600;color:var(--accent)}footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.875rem}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}::selection{background:#b9d0ff;color:#132947}input{caret-color:var(--accent)}*{scrollbar-color:#7c92ab #edf2f7;scrollbar-width:thin}[hidden]{display:none!important}
@media(max-width:850px){.filters{grid-template-columns:1fr 1fr 1fr}main{padding:30px 20px 48px}.filters label:first-child{grid-column:span 2}}
@media(max-width:520px){main{padding:24px 14px 40px}.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:span 2}.filters button{align-self:end}th,td{padding:10px 12px}.evidence dl{grid-template-columns:1fr}.evidence dd{margin-bottom:6px}.section{margin-top:30px}}
@media(prefers-reduced-motion:no-preference){details[open]>.evidence{animation:reveal .18s ease-out}@keyframes reveal{from{clip-path:inset(0 0 10% 0)}to{clip-path:inset(0)}}}
</style>
</head>
<body>
<main>
<header><h1 id="title"></h1><p id="question"></p><p class="muted" id="scope"></p><span class="mode" id="mode"></span></header>
<noscript>This local report needs JavaScript for its tables and filters. Ask the agent for a JSON or in-chat summary if scripts are disabled.</noscript>
<aside id="warnings" class="warning" hidden aria-label="Capture warnings"></aside>
<section class="section" aria-labelledby="topics-title"><h2 id="topics-title" data-i18n="topics"></h2><p class="muted" data-i18n="topicScope"></p><div class="table-wrap" tabindex="0" role="region" aria-labelledby="topics-title"><table><caption data-i18n="knownNote"></caption><thead id="topic-head"></thead><tbody id="topic-body"></tbody></table></div><div id="overlaps"></div></section>
<section class="section" id="theme-section" hidden aria-labelledby="themes-title"><h2 id="themes-title" data-i18n="themes"></h2><p class="muted" data-i18n="themeNote"></p><div class="table-wrap" tabindex="0" role="region" aria-labelledby="themes-title"><table><thead id="theme-head"></thead><tbody id="theme-body"></tbody></table></div></section>
<section class="section" aria-labelledby="posts-title"><h2 id="posts-title" data-i18n="posts"></h2><p class="muted" data-i18n="filterNote"></p>
<form id="filters" class="filters">
<label><span data-i18n="search"></span><input id="search" type="search" autocomplete="off"></label>
<label><span data-i18n="topic"></span><select id="topic"></select></label>
<label><span data-i18n="from"></span><input id="from" type="date"></label>
<label><span data-i18n="to"></span><input id="to" type="date"></label>
<label><span data-i18n="sort"></span><select id="sort"><option value="newest" data-i18n="newest"></option><option value="oldest" data-i18n="oldest"></option><option value="likes" data-i18n="likesSort"></option><option value="comments" data-i18n="commentsSort"></option></select></label>
<button type="reset" data-i18n="reset"></button>
</form>
<p id="result-count" class="results" role="status" aria-live="polite"></p>
<div class="table-wrap" tabindex="0" role="region" aria-labelledby="posts-title"><table><thead id="post-head"></thead><tbody id="post-body"></tbody></table></div>
</section>
<section class="section"><details><summary data-i18n="allSources"></summary><div id="all-sources"></div></details></section>
<footer><p data-i18n="limitations"></p><p id="generated"></p></footer>
</main>
<script type="application/json" id="report-data" nonce="__NONCE__">__REPORT_DATA__</script>
<script nonce="__NONCE__">
'use strict';
const data=JSON.parse(document.getElementById('report-data').textContent);
const translations={
en:{notes:'Capture notes',warningSummary:'These observations have evidence limits. Check the source notes before drawing conclusions.',topics:'Content topics',topicScope:'Whole-report totals. The post filters below do not change these topic comparisons.',knownNote:'Accounts with observed stable IDs are deduplicated; handle-only observations are provisional.',topic:'Topic',postCount:'Posts',known:'Accounts with IDs',handles:'Handle-only observations',repeat:'ID matched in 2+ posts',possibleRepeat:'Possible repeat handles',exclusive:'ID only observed in this topic',themes:'Observed comment themes',themeNote:'Agent-grouped themes from observed comments; counts are observations, not estimates of the full discussion.',theme:'Theme',count:'Observed records',sources:'Sources',posts:'Explore posts',filterNote:'Filters apply only to the post table. Dates refer to the latest capture for each post (UTC), not publication time.',search:'Search posts',searchHint:'Topic or post URL',identityHint:'Topic, post URL or included account',from:'Captured from',to:'Captured through',sort:'Sort posts',newest:'Newest capture',oldest:'Oldest capture',likesSort:'Most observed likers',commentsSort:'Most observed commenters',reset:'Reset',all:'All topics',shown:'posts shown',range:'The start date must not be later than the end date.',noResults:'No posts match. Clear a filter or reset to see all posts.',likes:'Observed likers',comments:'Observed commenters',both:'Both, matched by ID',possible:'Possible handle matches',date:'Latest capture (UTC)',evidence:'View evidence',notCollected:'Not collected',coverage:'Coverage',kind:'List type',captured:'Captured at',observed:'Observed accounts',total:'Source account total',end:'End evidence',stop:'Stopping reason',commentScope:'Comment scope',commentCount:'Distinct observed comment IDs',unknownComments:'Comment rows without IDs',displayedComments:'Displayed comment-record counter',accounts:'Included accounts',audience:'Observed audience overlap',likeOnly:'Liker IDs not observed among commenters',commentOnly:'Commenter IDs not observed among likers',allSources:'All source evidence',limitations:'These are observations from the listed captures. Missing accounts in partial data do not prove absence, unfollowing or lack of interest. Topic differences are not reach or causal growth.',generated:'Report generated',aggregate:'Aggregate export · participant membership lists omitted',pseudonymous:'Pseudonymous export · labels apply only within this report',identified:'Private identified export · contains participant handles/IDs',overlap:'Accounts observed across topics',scope:'captured posts',provisional:'provisional handle matches',format:'Format',reel:'Reel',post:'Post'},
tr:{notes:'Kaynak notları',warningSummary:'Bu gözlemlerin kanıt sınırları var. Sonuçları yorumlamadan kaynak notlarına bakabilirsin.',topics:'İçerik konuları',topicScope:'Raporun tamamına ait toplamlar. Aşağıdaki gönderi filtreleri konu karşılaştırmasını değiştirmez.',knownNote:'Sabit ID’si gözlenen hesaplar tekilleştirilir; yalnız kullanıcı adı olan gözlemler olası eşleşmedir.',topic:'Konu',postCount:'Gönderi',known:'ID’si gözlenen hesap',handles:'Yalnız kullanıcı adı',repeat:'ID ile 2+ gönderide',possibleRepeat:'Olası tekrar kullanıcı adı',exclusive:'ID yalnız bu konuda gözlendi',themes:'Gözlenen yorum konuları',themeNote:'Agent’ın gözlenen yorumlardan grupladığı konular; sayılar tüm konuşmanın tahmini değildir.',theme:'Yorum konusu',count:'Gözlenen kayıt',sources:'Kaynaklar',posts:'Gönderileri incele',filterNote:'Filtreler yalnız gönderi tablosunu etkiler. Tarihler yayın zamanını değil, gönderinin son gözlemini (UTC) belirtir.',search:'Gönderilerde ara',searchHint:'Konu veya gönderi bağlantısı',identityHint:'Konu, gönderi veya dahil edilen hesap',from:'Gözlem başlangıcı',to:'Gözlem bitişi',sort:'Gönderileri sırala',newest:'En yeni gözlem',oldest:'En eski gözlem',likesSort:'En çok gözlenen beğenen',commentsSort:'En çok gözlenen yorumcu',reset:'Sıfırla',all:'Bütün konular',shown:'gönderi gösteriliyor',range:'Başlangıç tarihi bitişten sonra olamaz.',noResults:'Eşleşen gönderi yok. Bir filtreyi kaldırabilir veya sıfırlayabilirsin.',likes:'Gözlenen beğenen',comments:'Gözlenen yorumcu',both:'İkisinde de, ID eşleşmesi',possible:'Olası kullanıcı adı eşleşmesi',date:'Son gözlem (UTC)',evidence:'Kanıtı gör',notCollected:'Toplanmadı',coverage:'Kapsam',kind:'Liste türü',captured:'Gözlem zamanı',observed:'Gözlenen hesap',total:'Kaynak hesap toplamı',end:'Bitiş kanıtı',stop:'Durma nedeni',commentScope:'Yorum kapsamı',commentCount:'Gözlenen farklı yorum ID’si',unknownComments:'ID’si olmayan yorum satırı',displayedComments:'Ekrandaki yorum kaydı sayacı',accounts:'Dahil edilen hesaplar',audience:'Gözlenen kitle kesişimi',likeOnly:'Yorumcularda gözlenmeyen beğenen ID’leri',commentOnly:'Beğenenlerde gözlenmeyen yorumcu ID’leri',allSources:'Bütün kaynakların kanıtı',limitations:'Bunlar belirtilen gözlemlerin sonuçlarıdır. Kısmi listede görünmemek; yokluk, takibi bırakma veya ilgisizlik kanıtı değildir. Konu farkları gerçek erişim veya nedensel büyüme ölçümü değildir.',generated:'Rapor oluşturulma zamanı',aggregate:'Toplu rapor · katılımcı listeleri dahil değil',pseudonymous:'Takma adlı rapor · adlar yalnız bu raporda geçerli',identified:'Özel kimlikli rapor · katılımcı kullanıcı adı/ID içerebilir',overlap:'Konular arasında gözlenen hesaplar',scope:'gönderi gözlemi',provisional:'olası kullanıcı adı eşleşmesi',format:'Format',reel:'Reels',post:'Gönderi'}
};
const ui=translations[document.documentElement.lang]||translations.en;
const byId=id=>document.getElementById(id);
function node(tag,value,className){const n=document.createElement(tag);if(value!==undefined)n.textContent=String(value);if(className)n.className=className;return n;}
function head(id,labels){const row=node('tr');for(const label of labels){const th=node('th',label);th.scope='col';row.append(th);}byId(id).append(row);}
function value(v){return v===null||v===undefined?'—':String(v);}
function link(url){const a=node('a',url);a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.referrerPolicy='no-referrer';return a;}
function evidence(source){const box=node('div',undefined,'evidence');box.append(link(source.source_url));const dl=node('dl');const pairs=[[ui.kind,source.kind],[ui.captured,source.captured_at_utc],[ui.coverage,source.coverage],[ui.observed,source.observed_accounts],[ui.total,source.returned_total??source.displayed_total],[ui.end,source.end_evidence],[ui.stop,source.stop_reason]];if(source.kind==='commenters')pairs.push([ui.commentScope,source.comment_scope],[ui.commentCount,source.identified_comment_count],[ui.unknownComments,source.unidentified_comment_rows],[ui.displayedComments,source.displayed_comment_total]);for(const [k,v] of pairs){dl.append(node('dt',k),node('dd',value(v)));}box.append(dl);return box;}
document.querySelectorAll('[data-i18n]').forEach(n=>n.textContent=ui[n.dataset.i18n]);
byId('title').textContent=data.title;byId('question').textContent=data.question;byId('scope').textContent=`${data.posts.length} ${ui.scope} · ${data.sources.map(s=>s.captured_at_utc).sort()[0].slice(0,19).replace('T',' ')} – ${data.sources.map(s=>s.captured_at_utc).sort().at(-1).slice(0,19).replace('T',' ')} UTC`;byId('mode').textContent=ui[data.identity_mode];byId('generated').textContent=`${ui.generated}: ${data.generated_at_utc}`;byId('search').placeholder=data.identity_mode==='aggregate'?ui.searchHint:ui.identityHint;
if(data.warnings.length){byId('warnings').hidden=false;byId('warnings').append(node('p',ui.warningSummary));const notes=node('details'),summary=node('summary',`${ui.notes} (${data.warnings.length})`);notes.append(summary);for(const warning of data.warnings)notes.append(node('p',warning));byId('warnings').append(notes);}
head('topic-head',[ui.topic,ui.postCount,ui.known,ui.handles,ui.repeat,ui.possibleRepeat,ui.exclusive]);
for(const topic of data.topics){const row=node('tr');for(const key of ['topic','posts','known_accounts','handle_only_accounts','repeat_known_accounts','possible_repeat_handles','only_observed_in_topic'])row.append(node('td',topic[key],key==='topic'?'':'number'));byId('topic-body').append(row);}
if(data.topic_overlap.length){
 byId('overlaps').append(node('h3',ui.overlap));
 for(const pair of data.topic_overlap){
  const detail=node('details'),summary=node('summary',`${pair.first} / ${pair.second}: ${pair.known_count} (${ui.known}); ${pair.possible_handle_count} ${ui.provisional}`),content=node('div',undefined,'evidence');
  if(pair.accounts.length)content.append(node('p',pair.accounts.join(', '),'identities'));
  if(pair.possible_handles.length)content.append(node('p',`${ui.possible}: ${pair.possible_handles.join(', ')}`,'identities'));
  if(data.identity_mode==='aggregate')content.append(node('p',ui.aggregate));
  content.append(node('h3',ui.sources));
  for(const post of data.posts.filter(p=>p.topic===pair.first||p.topic===pair.second))content.append(node('p',post.topic),link(post.source_url));
  detail.append(summary,content);byId('overlaps').append(detail);
 }
}
if(data.comment_themes.length){byId('theme-section').hidden=false;head('theme-head',[ui.theme,ui.count,ui.sources]);for(const theme of data.comment_themes){const row=node('tr');row.append(node('td',theme.label),node('td',theme.observed_count,'number'));const sourceCell=node('td');for(const key of theme.source_keys){const source=data.sources.find(c=>c.key===key);if(source){sourceCell.append(link(source.source_url),node('br'));}}row.append(sourceCell);byId('theme-body').append(row);}}
const all=node('option',ui.all);all.value='';byId('topic').append(all);for(const topic of data.topics){const option=node('option',topic.topic);option.value=topic.topic;byId('topic').append(option);}
head('post-head',[ui.topic,ui.format,ui.date,ui.likes,ui.comments,ui.both,ui.possible,ui.evidence]);
function render(){
 const query=byId('search').value.toLocaleLowerCase().trim(),topic=byId('topic').value,from=byId('from').value,to=byId('to').value;
 byId('post-body').replaceChildren();
 if(from&&to&&from>to){byId('result-count').textContent=ui.range;return;}
 const rows=data.posts.filter(p=>{const haystack=[p.topic,p.source_url,...p.accounts].join(' ').toLocaleLowerCase();const date=p.captured_at_utc.slice(0,10);return (!query||haystack.includes(query))&&(!topic||p.topic===topic)&&(!from||date>=from)&&(!to||date<=to);});
 const sort=byId('sort').value;rows.sort((a,b)=>sort==='likes'?(b.likers??-1)-(a.likers??-1):sort==='comments'?(b.commenters??-1)-(a.commenters??-1):sort==='oldest'?a.captured_at_utc.localeCompare(b.captured_at_utc):b.captured_at_utc.localeCompare(a.captured_at_utc));
 byId('result-count').textContent=`${rows.length} / ${data.posts.length} ${ui.shown}`;
 if(!rows.length){const row=node('tr'),cell=node('td',ui.noResults,'empty');cell.colSpan=8;row.append(cell);byId('post-body').append(row);}
 for(const post of rows){
  const row=node('tr');row.append(node('td',post.topic),node('td',post.format==='reel'?ui.reel:ui.post),node('td',post.captured_at_utc.slice(0,19).replace('T',' '),'nowrap'),node('td',value(post.likers),'number'),node('td',value(post.commenters),'number'),node('td',post.both?post.both.known_count:'—','number'),node('td',post.both?post.both.possible_handle_count:'—','number'));
  const cell=node('td'),details=node('details'),summary=node('summary',ui.evidence);details.append(summary);const content=node('div',undefined,'evidence');content.append(link(post.source_url));
  if(post.both){content.append(node('p',`${ui.possible}: ${post.both.possible_handle_count}`),node('p',`${ui.likeOnly}: ${post.like_not_observed_comment}`),node('p',`${ui.commentOnly}: ${post.comment_not_observed_like}`));}
  if(post.accounts.length){content.append(node('h3',ui.accounts),node('p',post.accounts.join(', '),'identities'));}
  if(post.both&&post.both.accounts.length)content.append(node('p',`${ui.both}: ${post.both.accounts.join(', ')}`,'identities'));
  if(post.both&&post.both.possible_handles.length)content.append(node('p',`${ui.possible}: ${post.both.possible_handles.join(', ')}`,'identities'));
  for(const audience of post.audiences)content.append(node('p',`${ui.audience} (${audience.kind}): ${audience.overlap.known_count} ID; ${audience.overlap.possible_handle_count} ${ui.provisional}`),link(audience.source_url));
  for(const source of post.sources)content.append(evidence(source));details.append(content);cell.append(details);row.append(cell);byId('post-body').append(row);
 }
}
byId('filters').addEventListener('submit',event=>event.preventDefault());byId('filters').addEventListener('input',render);byId('filters').addEventListener('change',render);byId('filters').addEventListener('reset',()=>setTimeout(render,0));
for(const source of data.sources)byId('all-sources').append(evidence(source));render();
</script>
</body>
</html>
